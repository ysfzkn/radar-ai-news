[project]
name = "radar"
version = "0.1.0"
description = "Radar: a collector for AI news that matters to developers."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "feedparser",
    "pydantic",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
