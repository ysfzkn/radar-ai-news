# Weekly update proposals: the pinned actions (Dependabot keeps the commit pin and the
# version comment), the agent's uv lock and the two npm locks. Nothing is merged
# without a review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /agent
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
