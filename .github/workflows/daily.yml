name: Daily

# Runs `radar daily` every morning and keeps the agent's database between runs as one
# encrypted file on the branch `radar-state`. Nothing happens unless the repository
# variable RADAR_ENABLED is "true". See docs/automation.md.

on:
  schedule:
    - cron: "15 21 * * *" # 00:15 in Istanbul; GitHub may start it hours late
  workflow_dispatch:
    inputs:
      max_stories:
        description: "Most stories to write in this run (empty: the default)"
        type: string
        default: ""
      mode:
        description: "normal; review_all (publish nothing, every story waits for review); collect_only (collect sources only: no model call, no story, no push)"
        type: choice
        options:
          - normal
          - review_all
          - collect_only
        default: normal

# The run's title names how it was started (the admin's run list shows it).
run-name: ${{ format('Daily · {0}{1}', inputs.mode || 'normal', inputs.max_stories && format(' · {0}', inputs.max_stories) || '') }}

# Read-only by default. Only the push job, which runs git and two first-party actions
# and nothing else, gets write access.
permissions:
  contents: read

# Two runs never overlap; a second one waits for the first. This covers both jobs.
concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  daily:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job runs uv, the dependencies and the agent, so its token can only read. The
    # encrypted state file leaves it as an artifact for the push job below.
    permissions:
      contents: read
    outputs:
      packed: ${{ steps.save.outputs.packed }}
    defaults:
      run:
        working-directory: agent
    steps:
      # Actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Choose the database path
        run: echo "RADAR_DB_PATH=$RUNNER_TEMP/radar.db" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.10.7"

      - run: uv sync --locked

      - name: Restore state
        id: restore
        env:
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
        run: |
          # A missing or short key must stop the job before anything is spent.
          if [ "${#RADAR_STATE_KEY}" -lt 16 ]; then
            echo "RADAR_STATE_KEY is missing or too short (16 characters or more are needed)."
            exit 1
          fi
          code=0
          git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin radar-state >/dev/null || code=$?
          if [ "$code" = 2 ]; then
            echo "No radar-state branch yet: starting from an empty database."
            exit 0
          fi
          if [ "$code" != 0 ]; then
            echo "Could not look up the radar-state branch (git exit code $code)."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --quiet --depth 1 origin radar-state
          git -C "$GITHUB_WORKSPACE" show FETCH_HEAD:state.bin > "$RUNNER_TEMP/state.bin"
          uv run radar state load --db "$RADAR_DB_PATH" --file "$RUNNER_TEMP/state.bin"

      - name: Run radar daily
        id: daily
        # Shorter than the job's limit: a timeout here is a step failure, so the state is still saved.
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_INGEST_TOKEN: ${{ secrets.RADAR_INGEST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_SMTP_HOST: ${{ vars.RADAR_SMTP_HOST }}
          RADAR_SMTP_PORT: ${{ vars.RADAR_SMTP_PORT }}
          RADAR_SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          RADAR_MAIL_FROM: ${{ secrets.RADAR_MAIL_FROM }}
          RADAR_MAIL_TO: ${{ secrets.RADAR_MAIL_TO }}
          RADAR_ADMIN_URL: ${{ vars.RADAR_ADMIN_URL }}
          RADAR_DAILY_CAP_USD: ${{ vars.RADAR_DAILY_CAP_USD }}
          MAX_STORIES: ${{ inputs.max_stories }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          args=()
          if [ -n "$MAX_STORIES" ]; then
            case "$MAX_STORIES" in
              *[!0-9]*) echo "max_stories must be a whole number."; exit 1 ;;
            esac
            args=(--max-stories "$MAX_STORIES")
          fi
          # A scheduled run has no inputs: an empty mode is the normal run.
          case "$RUN_MODE" in
            "" | normal) ;;
            review_all) args+=(--review-all) ;;
            collect_only) args+=(--collect-only) ;;
            *) echo "mode must be normal, review_all or collect_only."; exit 1 ;;
          esac
          uv run radar daily "${args[@]}"

      - name: Save state
        id: save
        if: always() && steps.restore.outcome == 'success'
        env:
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
        run: |
          if [ ! -f "$RADAR_DB_PATH" ]; then
            echo "No database was written; nothing to save."
            exit 0
          fi
          uv run radar state save --db "$RADAR_DB_PATH" --file "$RUNNER_TEMP/state.bin"
          echo "packed=true" >> "$GITHUB_OUTPUT"

      # Hands the encrypted file to the push job (it is public on the branch anyway).
      - name: Hand over the state file
        if: always() && steps.save.outputs.packed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-state
          path: ${{ runner.temp }}/state.bin
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The only job with write access. It runs no uv, no dependency and no agent code: a
  # checkout without credentials, the artifact download, and git. always(): the state
  # must still be pushed when the run step failed after the save step produced it.
  push:
    needs: daily
    if: always() && vars.RADAR_ENABLED == 'true' && needs.daily.outputs.packed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radar-state
          path: ${{ runner.temp }}/state

      - name: Push state
        id: push
        env:
          PUSH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # A single parentless commit holding one file.
          blob=$(git hash-object -w --no-filters "$RUNNER_TEMP/state/state.bin")
          tree=$(printf '100644 blob %s\tstate.bin\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m state)
          # The token reaches this one push through git's environment, as the header
          # actions/checkout would otherwise store: it is not written to .git/config,
          # not on a command line and never printed. Its base64 form is masked too.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --quiet --force origin "$commit:refs/heads/radar-state"
          echo "Saved state to the radar-state branch."
