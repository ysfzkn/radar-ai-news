name: Daily

# Runs `radar daily` every morning and keeps the agent's database between runs as one
# encrypted file on the branch `radar-state`. Nothing happens unless the repository
# variable RADAR_ENABLED is "true". See docs/automation.md.

on:
  schedule:
    - cron: "15 4 * * *" # 07:15 in Istanbul
  workflow_dispatch:
    inputs:
      max_stories:
        description: "Most stories to write in this run (empty: the default)"
        type: string
        default: ""

# Read-only by default; the job below raises this for its one push step.
permissions:
  contents: read

# Two runs never overlap; a second one waits for the first.
concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  daily:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write access is for the state branch only. The token is handed to the push step
    # alone; checkout does not keep it, so uv and the agent never see it.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agent
    steps:
      # Actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Choose the database path
        run: echo "RADAR_DB_PATH=$RUNNER_TEMP/radar.db" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.10.7"

      - run: uv sync --locked

      - name: Restore state
        id: restore
        env:
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
        run: |
          # A missing or short key must stop the job before anything is spent.
          if [ "${#RADAR_STATE_KEY}" -lt 16 ]; then
            echo "RADAR_STATE_KEY is missing or too short (16 characters or more are needed)."
            exit 1
          fi
          code=0
          git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin radar-state >/dev/null || code=$?
          if [ "$code" = 2 ]; then
            echo "No radar-state branch yet: starting from an empty database."
            exit 0
          fi
          if [ "$code" != 0 ]; then
            echo "Could not look up the radar-state branch (git exit code $code)."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --quiet --depth 1 origin radar-state
          git -C "$GITHUB_WORKSPACE" show FETCH_HEAD:state.bin > "$RUNNER_TEMP/state.bin"
          uv run radar state load --db "$RADAR_DB_PATH" --file "$RUNNER_TEMP/state.bin"

      - name: Run radar daily
        id: daily
        # Shorter than the job's limit: a timeout here is a step failure, so the state is still saved.
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_INGEST_TOKEN: ${{ secrets.RADAR_INGEST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_SMTP_HOST: ${{ vars.RADAR_SMTP_HOST }}
          RADAR_SMTP_PORT: ${{ vars.RADAR_SMTP_PORT }}
          RADAR_SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          RADAR_MAIL_FROM: ${{ secrets.RADAR_MAIL_FROM }}
          RADAR_MAIL_TO: ${{ secrets.RADAR_MAIL_TO }}
          RADAR_ADMIN_URL: ${{ vars.RADAR_ADMIN_URL }}
          RADAR_DAILY_CAP_USD: ${{ vars.RADAR_DAILY_CAP_USD }}
          MAX_STORIES: ${{ inputs.max_stories }}
        run: |
          args=()
          if [ -n "$MAX_STORIES" ]; then
            case "$MAX_STORIES" in
              *[!0-9]*) echo "max_stories must be a whole number."; exit 1 ;;
            esac
            args=(--max-stories "$MAX_STORIES")
          fi
          uv run radar daily "${args[@]}"

      - name: Save state
        id: save
        if: always() && steps.restore.outcome == 'success'
        env:
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
        run: |
          if [ ! -f "$RADAR_DB_PATH" ]; then
            echo "No database was written; nothing to save."
            exit 0
          fi
          uv run radar state save --db "$RADAR_DB_PATH" --file "$RUNNER_TEMP/state.bin"
          echo "packed=true" >> "$GITHUB_OUTPUT"

      # The only step that holds the write token, and it runs git alone.
      - name: Push state
        id: push
        if: always() && steps.save.outputs.packed == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # A single parentless commit holding one file.
          cd "$GITHUB_WORKSPACE"
          blob=$(git hash-object -w --no-filters "$RUNNER_TEMP/state.bin")
          tree=$(printf '100644 blob %s\tstate.bin\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m state)
          # The token reaches this one push through git's environment, as the header
          # actions/checkout would otherwise store: it is not written to .git/config,
          # not on a command line and never printed.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --quiet --force origin "$commit:refs/heads/radar-state"
          echo "Saved state to the radar-state branch."
